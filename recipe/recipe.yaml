context:
  version: "0.1.6"

package:
  name: xee-rust
  version: ${{ version }}

source:
  url: https://github.com/Paligo/xee/archive/refs/tags/xee-v${{ version }}.tar.gz
  sha256: a330b26d359e83fad9b736f4ab112a907b031e9dea8523af1561d3c3a9f94be5

build:
  number: 1
  script:
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
      # instruct `cc` crate to use clang-cl natively to compile build-time tools intended to be run on the host when cross-compiling from `win_64`
      AR_x86_64_pc_windows_msvc: llvm-lib
      CC_x86_64_pc_windows_msvc: clang-cl
      CXX_x86_64_pc_windows_msvc: clang-cl
    content:
      - cd xee
      - if: unix
        then:
          - cargo auditable install --path=. --root="$PREFIX" --no-track --locked --bins
      - if: win
        then:
          - cargo auditable install --path=. --root="%LIBRARY_PREFIX%" --no-track --locked --bins
      - cargo-bundle-licenses --format=yaml --output=../THIRDPARTY.yml

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses

tests:
  - script:
      - xee --help
      - xee --version
  - package_contents:
      bin:
        - xee
      strict: true

about:
  summary: "Swiss Army knife for XML, XPath and XSLT"
  description: |
    Xee is an XML execution engine written in Rust. The `xee` CLI provides an
    almost complete XPath 3.1 implementation that can load XML documents, issue
    XPath expressions against them (including in a REPL), pretty-print XML
    documents, and transform XML documents using XSLT stylesheets.
  license: MIT AND Unicode-3.0
  license_file:
    - COPYRIGHT
    - LICENSE-MIT
    - THIRDPARTY.yml
  homepage: https://github.com/Paligo/xee
  documentation: https://github.com/Paligo/xee/tree/main/xee
  repository: https://github.com/Paligo/xee

extra:
  recipe-maintainers:
    - salim-b
